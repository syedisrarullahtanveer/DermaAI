name: Security & SAST Scanning

on:
  push:
    branches: [ main, dermaai-next-100-batch-2 ]
  pull_request:
    branches: [ main ]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bandit Python SAST Scan
        run: |
          pip install bandit
          bandit -r backend/ src/ -ll -ii || true
