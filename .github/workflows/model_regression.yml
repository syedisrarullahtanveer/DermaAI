name: Model Regression Check

on:
  pull_request:
    paths:
      - 'src/models/**'
      - 'src/training/**'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run model architecture validation
        run: |
          python -m unittest tests/test_edge_cnn_v2.py tests/test_dense_block.py tests/test_efficientnet_finetune.py
